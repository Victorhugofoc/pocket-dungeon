<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character preview</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #14181c; font: 14px system-ui, sans-serif; color: #e8e8e8; }
      canvas { display: block; width: 100%; height: 100%; }
      #bar { position: fixed; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
      #bar button { background: #262c34; color: inherit; border: 1px solid #47505c; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
      #bar button.on { background: #b8382a; border-color: #e0604c; }
      #hint { position: fixed; left: 12px; bottom: 10px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="bar"></div>
    <div id="hint"></div>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
